name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting (forge fmt)
        run: forge fmt --check

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install solhint & prettier
        run: npm install -g solhint prettier prettier-plugin-solidity

      - name: Run solhint
        run: |
          SOL_FILES=$(find contracts -name "*.sol" 2>/dev/null | head -1)
          if [ -z "$SOL_FILES" ]; then
            echo "No Solidity files found — skipping solhint"
          else
            solhint "contracts/**/*.sol"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile contracts
        run: |
          SOL_FILES=$(find contracts -name "*.sol" 2>/dev/null | head -1)
          if [ -z "$SOL_FILES" ]; then
            echo "No Solidity files found — skipping build"
          else
            forge build --sizes
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          SOL_FILES=$(find contracts -name "*.sol" 2>/dev/null | head -1)
          if [ -z "$SOL_FILES" ]; then
            echo "No Solidity files found — skipping tests"
          else
            forge test -vvv
          fi
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Run coverage
        run: |
          SOL_FILES=$(find contracts -name "*.sol" 2>/dev/null | head -1)
          if [ -z "$SOL_FILES" ]; then
            echo "No Solidity files found — skipping coverage"
            echo "# Coverage Report" > coverage/coverage.md
            echo "No contracts to analyse yet." >> coverage/coverage.md
          else
            forge coverage --report lcov
            forge coverage --report summary | tee coverage/coverage.md
          fi
        env:
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.md

  slither:
    name: Slither
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Slither
        run: |
          SOL_FILES=$(find contracts -name "*.sol" 2>/dev/null | head -1)
          if [ -z "$SOL_FILES" ]; then
            echo "No Solidity files found — skipping Slither"
          fi
        shell: bash

      - name: Run Slither analysis
        if: ${{ hashFiles('contracts/**/*.sol') != '' }}
        uses: crytic/slither-action@v0.4.1
        with:
          node-version: "20"
          slither-args: >
            --exclude-dependencies
            --filter-paths "contracts/security/ReentrancyVuln.sol,contracts/security/AccessVuln.sol"